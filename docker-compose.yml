services:
  postgres:
    image: postgres:16-alpine
    container_name: ogfi-inventory-postgres
    environment:
      POSTGRES_DB: ogfi_inventory
      POSTGRES_USER: ogfi
      POSTGRES_PASSWORD: ogfi_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ogfi -d ogfi_inventory"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ogfi-inventory-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
